name: build

on:
  schedule:
    - cron: "0 1 * * *"   # 每天 09:00（北京时间）检查有没有到期的文章
  workflow_dispatch:       # 也可以在 Actions 页面手动触发

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install markdown

      # 前置判断：今天没有到期未发布的文章就整轮跳过。
      # 没有这一步，build.py 仍会重写 feed.xml 的 lastBuildDate，产生一条只改一行的
      # 空提交（11/26、11/27、11/28 连续三天都是这样）。--pending 只读不写，
      # 退出码 0 = 有待发布，1 = 没有。
      - name: 今天有到期文章吗
        id: due
        run: |
          if python build.py --pending; then
            echo "found=1" >> "$GITHUB_OUTPUT"
          else
            echo "found=0" >> "$GITHUB_OUTPUT"
            echo "今天没有到期未发布的文章，跳过构建与提交"
          fi

      - name: 生成静态文件
        if: steps.due.outputs.found == '1'
        run: python build.py

      - name: 有变化才提交
        if: steps.due.outputs.found == '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "构建产物无变化，跳过"
          else
            git commit -m "构建：发布当天到期的文章"
            git push
          fi
